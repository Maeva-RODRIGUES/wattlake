# Dependency update pull requests (see docs/adr/005-integration-continue.md).
# The cooldown applies the project's rule: a release is only adopted once it is
# at least two weeks old. It does not delay security updates.
# Not covered here, reviewed by hand (README.md, "Mettre à jour les versions"):
# the Helm charts and Python version in the Makefile, the image tags in the
# Helm values, transform/requirements.txt and streaming/requirements*.txt
# (compiled with hashes by uv pip compile), and Airflow itself with the packages
# pinned to its constraints (see below).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: /ingestion
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # An Airflow upgrade also changes airflowVersion (infra/airflow/values.yaml),
      # the chart, the constraints file and "apache-airflow==" in the Dockerfile:
      # it is a step of its own, not a one-line FROM change.
      - dependency-name: apache/airflow
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: pip
    directory: /ingestion
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Pinned to the Airflow 3.2.2 constraints, which the image and the tests
      # install with: another version cannot be resolved. They move with Airflow.
      - dependency-name: httpx
      - dependency-name: pyarrow
      - dependency-name: s3fs
      - dependency-name: sqlalchemy

  # Base image of the real-time producer (python:3.13.x-slim, pinned by digest).
  - package-ecosystem: docker
    directory: /streaming
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Only patch releases (3.13.x) and rebuilds of the same tag are proposed.
      # A new Python minor version needs wheels for every dependency
      # (confluent-kafka has none for 3.15 yet) and the same Python for the
      # tests (STREAMING_PYTHON in the Makefile): it is a step of its own.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
