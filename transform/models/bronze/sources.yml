version: 2

sources:
  - name: bronze
    description: >
      Raw eCO2mix data: the history, loaded by the Airflow DAG
      eco2mix_history_to_bronze (ingestion/), and the real-time stream, written
      by the streaming writer (streaming/). Values are kept as the source
      publishes them: see docs/sources.md for the fields, units and known quirks.
    # Catalog of the target: bronze is read on the branch dbt writes to, so
    # the audit branch is built from the bronze snapshot it was created with.
    database: "{{ target.database }}"
    schema: bronze
    tables:
      - name: eco2mix_national_history
        description: >
          RTE national history (dataset eco2mix-national-cons-def), definitive
          and consolidated data, from January 2012. Quarter-hour forecasts,
          half-hour realised values. Contains 4 artificial rows a year at the
          spring clock change (docs/sources.md, quirk 7).
        columns:
          - name: date_heure
            description: Timestamp in UTC, the reference for time.
          - name: date
            description: Local date (Paris time), as text.
          - name: heure
            description: Local time (Paris time), as text. Ambiguous at clock changes.
          - name: nature
            description: Data status (real-time, consolidated, definitive).
          - name: consommation
            description: Realised consumption, in MW. Null on quarter-hour rows.
          - name: _source_dataset
            description: ODRE dataset the row was loaded from.
          - name: _ingested_at
            description: Time of the load that wrote the row (UTC).
      - name: eco2mix_national_realtime
        description: >
          RTE national real-time data (dataset eco2mix-national-tr), from
          September 1st, 2026: one row per version of a quarter hour, appended
          by the streaming writer from Kafka (docs/adr/010-ecriture-flux-iceberg.md).
          Realised values every 15 minutes. The latest version of a quarter hour
          has the most recent _source_updated_at, then the highest _kafka_offset.
        columns:
          - name: date_heure
            description: Timestamp in UTC. Not unique here (one row per version).
          - name: _source_updated_at
            description: Refresh time of the dataset when the producer read the row (UTC).
          - name: _kafka_offset
            description: Offset of the Kafka message the row comes from.
