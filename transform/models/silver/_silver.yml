version: 2

# Power columns and energy (read before aggregating, step 3.3).
#
# Every *_mw column is a POWER in MW, not an energy. The history holds
# consolidated and definitive data, which RTE defines as average power over the
# time step ("données de puissance moyenne basées sur les comptages", RTE,
# "Spécification des fichiers de données en puissance pour éCO2mix", 1.1).
# The energy of one row is therefore:  energy_mwh = value_mw * step_hours
# where step_hours, a column of the model, is the duration the row's realised
# values cover:
#   - history rows: 0.5 h. Realised values only at minutes :00 and :30, null at
#     :15 and :45 (forecasts and, since 2024, commercial exchanges excepted).
#   - real-time rows (data_status = real_time, from 2026-09-01): 0.25 h, a value
#     every quarter hour. Treating real-time values as averages over the quarter
#     hour, like the consolidated ones, is an assumption (ADR 012).
# Summing MW values directly over a period gives a meaningless number.
#
# Assumption, not stated by the RTE specification: timestamp_utc is the START of
# the interval the value covers. It only matters at period boundaries (the first
# and last step of a day or month).

models:
  - name: eco2mix_national
    description: >
      eCO2mix national data from RTE, cleaned and typed. One row per quarter
      hour (timestamp_utc), January 2012 onwards, from two bronze tables
      (docs/adr/012-temps-reel-silver-gold.md): the history (consolidated and
      definitive data) and, after it, the real-time stream, of which only the
      latest version of each quarter hour is kept. The history replaces the
      real-time data for every quarter hour it covers. The 60 artificial rows of
      the spring clock changes are removed (local 02:00-02:45 does not exist,
      see docs/sources.md quirk 7). Both sources omit the first of the two
      repeated hours at the autumn clock change (quirk 8): those quarter hours
      are absent. "ND" text values become null, and columns get English names
      with their unit. History realised values are published every 30 minutes,
      real-time ones every 15 minutes: step_hours gives each row's duration.
    columns:
      - name: timestamp_utc
        description: Quarter hour, in UTC. Unique. Assumed to be the start of the interval.
        meta: {source_field: date_heure}
        data_tests:
          - unique
          - not_null
      - name: local_date
        description: Date in Paris time, for daily aggregation in the French calendar.
        meta: {source_field: date}
        data_tests:
          - not_null
      - name: data_status
        description: "Data status: definitive (until 2025-12-31), consolidated (2026), or real_time (real-time stream, after the history)."
        meta: {source_field: nature}
        data_tests:
          - not_null
          # An unmapped label (null after the CASE) must stop the build.
          - accepted_values:
              arguments:
                values: [definitive, consolidated, real_time]
      - name: step_hours
        description: >
          Duration in hours covered by the row's realised values: 0.5 for the
          history (published every 30 minutes), 0.25 for the real-time data
          (every 15 minutes). Energy (MWh) = power (MW) * step_hours.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0.25, 0.5]
                quote: false

      # Consumption and forecasts
      - name: consumption_mw
        description: Realised consumption, average power in MW over the row's time step. Energy = value * step_hours.
        meta: &half_hour_power {unit: MW, quantity: average_power, publication_step: "30min (history), 15min (real time)", energy_mwh: "value * step_hours", source_field: consommation}
        data_tests:
          # Published at every half hour in the history, every quarter hour in
          # the real-time data. Single known gap: 2026-01-01 00:00 Paris time,
          # missing at the source (realised values all null).
          - not_null:
              config:
                where: "(data_status = 'real_time' or minute(timestamp_utc) in (0, 30)) and timestamp_utc <> timestamp '2025-12-31 23:00:00 UTC'"
          # Observed range 29,124 to 102,098 MW (2012-2026). Wide bounds: they
          # catch a unit error (kW instead of MW), not a cold winter.
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20000
                max_value: 120000
      - name: consumption_forecast_day_ahead_mw
        description: Consumption forecast made the day before, power in MW every 15 minutes. Forecast energy = value * 0.25 h.
        meta: {unit: MW, quantity: forecast_power, publication_step: 15min, energy_mwh: "value * 0.25", source_field: prevision_j1}
        data_tests:
          - not_null
      - name: consumption_forecast_intraday_mw
        description: Consumption forecast updated the same day, power in MW every 15 minutes. Forecast energy = value * 0.25 h.
        meta: {unit: MW, quantity: forecast_power, publication_step: 15min, energy_mwh: "value * 0.25", source_field: prevision_j}
        data_tests:
          - not_null

      # Production by source. Never negative, except solar, coal and
      # pumped-storage turbining, see their tests.
      - name: nuclear_mw
        description: Nuclear production, average power in MW over the row's time step. Energy = value * step_hours.
        meta: {<<: *half_hour_power, source_field: nucleaire}
        data_tests: &non_negative
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: wind_mw
        description: Wind production, average power in MW over the row's time step. Energy = value * step_hours.
        meta: {<<: *half_hour_power, source_field: eolien}
        data_tests: *non_negative
      - name: solar_mw
        description: >
          Solar production, average power in MW over the row's time step.
          Energy = value * step_hours. Slightly negative at times between 2013 and 2020 (minimum
          -23 MW), most likely the auxiliary consumption of plants at night.
        meta: {<<: *half_hour_power, source_field: solaire}
        data_tests: &small_negative_allowed
          # Observed minimum -133 MW (coal), only from 2012 to 2020: auxiliary
          # consumption of idle plants. A larger negative value means a sign
          # or unit error at the source.
          - dbt_utils.accepted_range:
              arguments:
                min_value: -200
      - name: hydro_mw
        description: Hydro production, average power in MW over the row's time step. Energy = value * step_hours.
        meta: {<<: *half_hour_power, source_field: hydraulique}
        data_tests: *non_negative
      - name: bioenergy_mw
        description: Bioenergy production, average power in MW over the row's time step. Energy = value * step_hours.
        meta: {<<: *half_hour_power, source_field: bioenergies}
        data_tests: *non_negative
      - name: gas_mw
        description: Gas production, average power in MW over the row's time step. Energy = value * step_hours.
        meta: {<<: *half_hour_power, source_field: gaz}
        data_tests: *non_negative
      - name: coal_mw
        description: >
          Coal production, average power in MW over the row's time step.
          Energy = value * step_hours. Negative at times between 2012 and 2020 (minimum -133 MW),
          most likely the auxiliary consumption of idle plants.
        meta: {<<: *half_hour_power, source_field: charbon}
        data_tests: *small_negative_allowed
      - name: fuel_oil_mw
        description: Fuel oil production, average power in MW over the row's time step. Energy = value * step_hours.
        meta: {<<: *half_hour_power, source_field: fioul}
        data_tests: *non_negative

      # Production detail by technology: published from 2013-01-01 only, null in 2012
      - name: wind_onshore_mw
        description: Onshore wind, average power in MW over the row's time step. Real-time data only (from 2026-09-01), null for the history. Energy = value * step_hours.
        meta: {<<: *half_hour_power, available_from: "2026-09-01", source_field: eolien_terrestre}
        data_tests: *non_negative
      - name: wind_offshore_mw
        description: Offshore wind, average power in MW over the row's time step. Real-time data only (from 2026-09-01), null for the history. Energy = value * step_hours.
        meta: {<<: *half_hour_power, available_from: "2026-09-01", source_field: eolien_offshore}
        data_tests: *non_negative
      - name: hydro_run_of_river_mw
        description: Run-of-river hydro, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: &half_hour_detail {<<: *half_hour_power, available_from: "2013-01-01", source_field: hydraulique_fil_eau_eclusee}
      - name: hydro_reservoir_mw
        description: Reservoir hydro, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: hydraulique_lacs}
      - name: hydro_pumped_storage_generation_mw
        description: >
          Pumped-storage turbining, average power in MW over the row's time
          step, from 2013. Energy = value * step_hours. Down to -2 MW at times (2013-2020).
        meta: {<<: *half_hour_detail, source_field: hydraulique_step_turbinage}
        data_tests: *small_negative_allowed
      - name: bioenergy_waste_mw
        description: Waste bioenergy, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: bioenergies_dechets}
      - name: bioenergy_biomass_mw
        description: Biomass bioenergy, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: bioenergies_biomasse}
      - name: bioenergy_biogas_mw
        description: Biogas bioenergy, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: bioenergies_biogaz}
      - name: gas_combustion_turbine_mw
        description: Gas combustion turbines, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: gaz_tac}
      - name: gas_cogeneration_mw
        description: Gas cogeneration, average power in MW over the row's time step, from 2013. "ND" in the source becomes null. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: gaz_cogen}
      - name: gas_combined_cycle_mw
        description: Gas combined cycle, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: gaz_ccg}
      - name: gas_other_mw
        description: Other gas, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: gaz_autres}
      - name: fuel_oil_combustion_turbine_mw
        description: Fuel oil combustion turbines, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: fioul_tac}
      - name: fuel_oil_cogeneration_mw
        description: Fuel oil cogeneration, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: fioul_cogen}
      - name: fuel_oil_other_mw
        description: Other fuel oil, average power in MW over the row's time step, from 2013. Energy = value * step_hours.
        meta: {<<: *half_hour_detail, source_field: fioul_autres}

      # Storage
      - name: pumped_storage_pumping_mw
        description: >
          Power used by pumped-storage pumps, NEGATIVE values (a consumption),
          average power in MW over the row's time step. Energy = value *
          step_hours (negative).
          Do not add it to production totals.
        meta: {<<: *half_hour_power, sign: negative, source_field: pompage}
        data_tests:
          # A consumption, stored as negative values (observed maximum -1 MW).
          # A positive value would mean a sign change at the source.
          - dbt_utils.accepted_range:
              arguments:
                max_value: 0

      - name: battery_charging_mw
        description: >
          Power used to charge batteries, NEGATIVE values (a consumption),
          average power in MW over the row's time step. Real-time data only
          (from 2026-09-01), null for the history. Do not add it to production.
        meta: {<<: *half_hour_power, sign: negative, available_from: "2026-09-01", source_field: stockage_batterie}
        data_tests:
          # Observed -487 to 0 MW (docs/sources.md).
          - dbt_utils.accepted_range:
              arguments:
                max_value: 0
      - name: battery_discharging_mw
        description: >
          Power delivered by batteries, positive values, average power in MW
          over the row's time step. Real-time data only (from 2026-09-01), null
          for the history.
        meta: {<<: *half_hour_power, available_from: "2026-09-01", source_field: destockage_batterie}
        data_tests: *non_negative

      # Exchanges: negative means France exports, positive means it imports
      - name: physical_exchange_balance_mw
        description: Balance of physical flows at the borders, average power in MW over the row's time step. Negative = export. Energy = value * step_hours.
        meta: {<<: *half_hour_power, sign: "negative = export", source_field: ech_physiques}
      - name: commercial_exchange_great_britain_mw
        description: &commercial_exchange_description >
          Commercial exchange balance with this border, power in MW. Negative =
          export. Published every 30 minutes until 2024-06-26 22:00 UTC
          (2024-06-27 00:00 Paris time), then every 15 minutes: energy = value
          * 0.5 h before that time and value * 0.25 h after. The RTE
          specification defines average power for production and consumption
          only; treating exchanges the same way is an assumption.
        meta: &commercial_exchange {unit: MW, quantity: power, sign: "negative = export", publication_step: 30min, publication_step_from_2024-06-26T22:00Z: 15min, energy_mwh: "value * 0.5 before 2024-06-26T22:00Z, value * 0.25 after", source_field: ech_comm_angleterre}
      - name: commercial_exchange_spain_mw
        description: *commercial_exchange_description
        meta: {<<: *commercial_exchange, source_field: ech_comm_espagne}
      - name: commercial_exchange_italy_mw
        description: *commercial_exchange_description
        meta: {<<: *commercial_exchange, source_field: ech_comm_italie}
      - name: commercial_exchange_switzerland_mw
        description: *commercial_exchange_description
        meta: {<<: *commercial_exchange, source_field: ech_comm_suisse}
      - name: commercial_exchange_germany_belgium_mw
        description: *commercial_exchange_description
        meta: {<<: *commercial_exchange, source_field: ech_comm_allemagne_belgique}

      # Emissions
      - name: co2_intensity_g_per_kwh
        description: >
          Estimated CO2 intensity of French electricity production, in g/kWh,
          every 30 minutes. NOT a power: it cannot be converted to energy nor
          summed. Average it over a period weighted by the production energy
          of each step.
        meta: {unit: g/kWh, quantity: intensity, publication_step: 30min, energy_mwh: "not applicable", source_field: taux_co2}
        data_tests:
          # Observed range 5 to 141 g/kWh. The bounds catch a unit error
          # (kg/MWh is the same value, g/MWh would be a thousand times higher).
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 500

      # Lineage
      - name: source_dataset
        description: ODRE dataset the row was loaded from.
        meta: {source_field: _source_dataset}
        data_tests:
          - not_null
      - name: ingested_at
        description: Time of the bronze load that wrote the row (UTC).
        meta: {source_field: _ingested_at}
        data_tests:
          - not_null

# Unit tests: the model's SQL run on mocked input rows, without reading bronze.
unit_tests:
  - name: drops_spring_artefacts_and_maps_nd_to_null
    description: >
      On 2012-03-25 the source publishes local 02:30, which does not exist,
      with the same date_heure as the real 03:30 row. The model must keep 03:30
      only, and turn the text value "ND" into null.
    model: eco2mix_national
    given:
      - input: source('bronze', 'eco2mix_national_history')
        rows:
          - {date_heure: "2012-03-25 00:30:00 UTC", date: "2012-03-25", heure: "01:30", nature: "Données définitives", consommation: 47196, gaz_cogen: "-3170"}
          - {date_heure: "2012-03-25 01:30:00 UTC", date: "2012-03-25", heure: "02:30", nature: "Données définitives", consommation: 47196, gaz_cogen: "ND"}
          - {date_heure: "2012-03-25 01:30:00 UTC", date: "2012-03-25", heure: "03:30", nature: "Données définitives", consommation: 46383, gaz_cogen: "ND"}
      - input: source('bronze', 'eco2mix_national_realtime')
        rows: []
    expect:
      rows:
        - {timestamp_utc: "2012-03-25 00:30:00 UTC", data_status: definitive, consumption_mw: 47196, gas_cogeneration_mw: -3170}
        - {timestamp_utc: "2012-03-25 01:30:00 UTC", data_status: definitive, consumption_mw: 46383, gas_cogeneration_mw: null}

  - name: keeps_latest_realtime_version_after_the_history
    description: >
      The history ends with the 21:30 UTC quarter hour on 2026-08-31. The
      real-time table has a version of that same quarter hour, which the
      history replaces, and two versions of 22:00 UTC: the one with the most
      recent _source_updated_at wins. Real-time rows cover 0.25 h, history rows
      0.5 h, and the run-of-river value published as text becomes an integer.
    model: eco2mix_national
    given:
      - input: source('bronze', 'eco2mix_national_history')
        rows:
          - {date_heure: "2026-08-31 21:30:00 UTC", date: "2026-08-31", heure: "23:30", nature: "Données consolidées", consommation: 39000}
      - input: source('bronze', 'eco2mix_national_realtime')
        rows:
          - {date_heure: "2026-08-31 21:30:00 UTC", date: "2026-08-31", heure: "23:30", nature: "Données temps réel", consommation: 38500, _source_updated_at: "2026-08-31 22:00:10 UTC", _kafka_offset: 1}
          - {date_heure: "2026-08-31 22:00:00 UTC", date: "2026-09-01", heure: "00:00", nature: "Données temps réel", consommation: 40000, hydraulique_fil_eau_eclusee: "3400", _source_updated_at: "2026-08-31 22:15:10 UTC", _kafka_offset: 2}
          - {date_heure: "2026-08-31 22:00:00 UTC", date: "2026-09-01", heure: "00:00", nature: "Données temps réel", consommation: 41000, hydraulique_fil_eau_eclusee: "3492", _source_updated_at: "2026-08-31 22:30:10 UTC", _kafka_offset: 5}
    expect:
      rows:
        - {timestamp_utc: "2026-08-31 21:30:00 UTC", data_status: consolidated, step_hours: 0.5, consumption_mw: 39000, hydro_run_of_river_mw: null}
        - {timestamp_utc: "2026-08-31 22:00:00 UTC", data_status: real_time, step_hours: 0.25, consumption_mw: 41000, hydro_run_of_river_mw: 3492}
