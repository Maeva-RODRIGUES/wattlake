# dbt project building the silver and gold layers from the bronze layer, on Trino.
# Usage: make dbt ARGS="<dbt command>" (see transform/README.md).
name: wattlake
version: "0.1.0"
config-version: 2

profile: wattlake

model-paths: ["models"]
target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  wattlake:
    silver:
      # Rebuilt in full on each run (about 500,000 rows). "replace" makes Trino
      # use CREATE OR REPLACE TABLE: readers see the old or the new table,
      # never a missing or half-written one.
      +materialized: table
      +on_table_exists: replace
    gold:
      # Exact schema name thanks to macros/generate_schema_name.sql.
      +schema: gold
      +materialized: table
      +on_table_exists: replace

flags:
  # No usage statistics sent to dbt Labs, and no .user.yml written locally.
  send_anonymous_usage_stats: false
  # Opt into the future default now. The local Trino is reached over plain
  # HTTP, so no certificate is involved today.
  require_certificate_validation: true
