[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "wattlake-ingestion"
version = "0.4.0"
description = "Extraction of the RTE eCO2mix datasets for the WattLake bronze layer"
license = "Apache-2.0"
# Same Python as the apache/airflow:3.2.2 image the DAGs run in.
requires-python = ">=3.13"
# Pinned to the Airflow 3.2.2 constraints where they list the package, so the
# image's versions are the ones tested here. PyIceberg is not in the constraints.
# s3fs is needed because Nessie makes PyIceberg use FsspecFileIO (ADR 004).
dependencies = [
    "httpx==0.28.1",
    "pyarrow==24.0.0",
    "pyiceberg[pyarrow]==0.12.0",
    "s3fs==2026.4.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "respx==0.23.1",
    # Local SQLite-backed Iceberg catalog for the bronze tests.
    "sqlalchemy==2.0.49",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wattlake_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
