# Trino query engine for the local WattLake cluster.
# Chart: trino/trino 1.45.0 (version pinned in infra/argocd/apps/trino.yaml).
# Deployed by Argo CD (infra/argocd/apps/trino.yaml), from the main branch.

image:
  tag: "484"

server:
  # One coordinator (planning) and one worker (execution).
  workers: 1
  node:
    environment: dev
  config:
    query:
      # Cluster-wide limit: a single worker with 1GB per node.
      maxMemory: "1GB"

coordinator:
  jvm:
    maxHeapSize: "1536M"
  config:
    query:
      # Must stay below heap minus headroom (30% of heap by default).
      maxMemoryPerNode: "512MB"
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi

worker:
  jvm:
    maxHeapSize: "2G"
  config:
    query:
      # 1GB + 30% headroom of a 2G heap = 1.6G, below the heap size.
      maxMemoryPerNode: "1GB"
  resources:
    requests:
      cpu: 500m
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 3Gi

catalogs:
  # Demo catalog with generated data, handy for tests without any dependency.
  tpch: |
    connector.name=tpch
    tpch.splits-per-node=4
  # Second demo catalog from the chart defaults: not needed.
  tpcds: null
  # Iceberg tables: Nessie native API as catalog (see ADR 002), SeaweedFS as storage.
  # Trino's own S3 identity, read from the environment variables defined below.
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3:8333
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:S3_ACCESS_KEY_ID}
    s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_KEY}
  # Same tables on the Nessie branch "audit", where dbt writes before the merge
  # into main (Write-Audit-Publish, see ADR 008). The branch is recreated by the
  # dbt_transformations DAG: Trino looks it up by name on each table access,
  # and first at the first query, so the catalog starts even without the branch.
  iceberg_audit: |
    connector.name=iceberg
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
    iceberg.nessie-catalog.ref=audit
    iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3:8333
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:S3_ACCESS_KEY_ID}
    s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_KEY}

# S3 keys of the "trino" SeaweedFS identity, on the coordinator and the workers.
# The Secret is created by "make secrets", outside Git (see docs/adr/006-gestion-des-secrets.md).
env:
  - name: S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: trino-credentials
        key: s3-access-key-id
  - name: S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: trino-credentials
        key: s3-secret-access-key
