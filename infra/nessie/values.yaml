# Nessie catalog for the local WattLake cluster.
# Chart: nessie/nessie 0.109.0 (version pinned in infra/argocd/apps/nessie.yaml).
# Deployed by Argo CD (infra/argocd/apps/nessie.yaml), from the main branch.

image:
  # Pinned explicitly instead of relying on the chart-version default.
  tag: "0.109.0"

replicaCount: 1

# Commits and references are stored in PostgreSQL (JDBC2), in the nessie
# database of the instance from infra/postgres: they survive pod restarts.
# See docs/adr/007-stockage-versions-nessie.md.
versionStoreType: JDBC2
jdbc:
  jdbcUrl: jdbc:postgresql://postgres.wattlake.svc.cluster.local:5432/nessie
  # Role and password from a Secret created by "make secrets", outside Git
  # (see docs/adr/006-gestion-des-secrets.md).
  secret:
    name: nessie-db-credentials
    username: username
    password: password

# Iceberg REST catalog (/iceberg), used by PyIceberg for ingestion. Trino stays
# on the native API (/api/v2): both see the same tables. See ADR 004.
catalog:
  enabled: true
  iceberg:
    defaultWarehouse: warehouse
    warehouses:
      - name: warehouse
        location: s3://warehouse/
  storage:
    s3:
      defaultOptions:
        endpoint: http://seaweedfs-s3:8333
        pathStyleAccess: true
        region: us-east-1
        # Nessie writes table metadata with its own static keys: the "nessie"
        # SeaweedFS identity, from a Secret created by "make secrets", outside
        # Git (see docs/adr/006-gestion-des-secrets.md).
        authType: STATIC
        accessKeySecret:
          name: nessie-credentials
          awsAccessKeyId: s3-access-key-id
          awsSecretAccessKey: s3-secret-access-key
        # Clients use their own S3 keys: no request signing, and no vended
        # credentials (clientIam stays disabled), which would need STS.
        requestSigningEnabled: false

# Quarkus JVM. With 512Mi, the image's default heap of 80% of the limit
# (-XX:MaxRAMPercentage=80) left too little for the memory outside the heap
# (classes, threads, compiled code): the container was OOMKilled under the
# load of the hourly dbt runs, the streaming writer and Nessie GC, before the
# JVM ran short of heap.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
extraEnv:
  # Heap capped at 60% of the limit (about 600 MB), read by the image's
  # run-java script, which turns it into -XX:MaxRAMPercentage: the rest of the
  # gigabyte is for the memory outside the heap.
  - name: JAVA_MAX_MEM_RATIO
    value: "60"
