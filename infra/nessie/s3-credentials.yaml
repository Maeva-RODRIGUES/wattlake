# S3 credentials Nessie uses to write Iceberg table metadata through its REST
# catalog (see docs/adr/004-catalogue-rest-ingestion.md). The chart only reads
# them from a Secret. Deployed by Argo CD with the Nessie chart (infra/argocd/apps/nessie.yaml).
# DEVELOPMENT ONLY: fake placeholder credentials from infra/seaweedfs/values.yaml,
# replaced by a dedicated SeaweedFS identity at step 4.4.
apiVersion: v1
kind: Secret
metadata:
  name: nessie-s3-credentials
  namespace: wattlake
type: Opaque
stringData:
  access-key-id: wattlake-dev-admin-access-key
  secret-access-key: wattlake-dev-admin-secret-key
