# Values for the apache-airflow/airflow chart 1.22.0 (Airflow 3.2.2).
# Deployed by Argo CD (infra/argocd/apps/airflow.yaml), from the main branch.

# airflowVersion drives the chart's version-specific templates: it must match
# the Airflow version of the image (apache/airflow:3.2.2 in ingestion/Dockerfile).
airflowVersion: "3.2.2"
images:
  airflow:
    # Custom image built from ingestion/Dockerfile and published by the CI
    # (.github/workflows/ci.yml), tagged with the commit SHA. To deploy a new
    # version: wait for the CI of a commit on main, then commit its SHA here.
    repository: ghcr.io/maeva-rodrigues/wattlake-airflow
    tag: 3374c852592a6bc9e05d09a234c801c6fbb25c96
    pullPolicy: IfNotPresent

# Tasks run as subprocesses of the scheduler: no Celery workers, no Redis broker.
executor: LocalExecutor

# Sized for a single developer workload. Init containers reuse their component's
# resources; the log-groomer sidecars only delete old log files.
scheduler:
  # Also runs the tasks with LocalExecutor, hence the largest limit.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  logGroomerSidecar:
    resources: &logGroomerResources
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
apiServer:
  # REST API and web interface: 4 uvicorn worker processes by default.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
dagProcessor:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # Not 500m: the liveness probe starts a full Airflow CLI ("airflow jobs
      # check") in the same container. At 500m the container was throttled in
      # every CFS period during the probe, which took about 6 s at rest and
      # over its 20 s timeout under load, so the kubelet restarted it 10 times
      # in 20 hours. Same limit as the scheduler and the API server.
      cpu: "1"
      memory: 1Gi
  logGroomerSidecar:
    resources: *logGroomerResources
triggerer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  logGroomerSidecar:
    resources: *logGroomerResources
  persistence:
    size: 1Gi

# The metadata database is the PostgreSQL instance from infra/postgres
# (see docs/adr/003-base-metadonnees-airflow.md), not the chart's bundled one.
postgresql:
  enabled: false
redis:
  enabled: false
# StatsD exporter: Airflow sends its metrics (scheduler loop, DAG runs, task
# durations and states) over StatsD, and the exporter serves them to Prometheus
# on port 9102 (airflow-statsd ServiceMonitor, infra/monitoring/values.yaml).
statsd:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Task logs are kept on small volumes (the chart default is 100Gi each).
# With LocalExecutor the scheduler runs the tasks, and the chart sizes its log
# volume from the worker settings, hence "workers.celery" below.
workers:
  celery:
    persistence:
      size: 1Gi

# PyIceberg catalog "wattlake", read by load_catalog("wattlake") in the DAGs:
# Nessie's Iceberg REST catalog, with the client's own S3 keys (ADR 004).
# PyIceberg maps PYICEBERG_CATALOG__WATTLAKE__S3__ACCESS_KEY_ID to s3.access-key-id.
env:
  - name: PYICEBERG_CATALOG__WATTLAKE__TYPE
    value: rest
  - name: PYICEBERG_CATALOG__WATTLAKE__URI
    value: http://nessie:19120/iceberg
# Keys of the "airflow" SeaweedFS identity, in every Airflow container.
secret:
  - envName: PYICEBERG_CATALOG__WATTLAKE__S3__ACCESS_KEY_ID
    secretName: airflow-credentials
    secretKey: s3-access-key-id
  - envName: PYICEBERG_CATALOG__WATTLAKE__S3__SECRET_ACCESS_KEY
    secretName: airflow-credentials
    secretKey: s3-secret-access-key

# Credentials from one Secret created by "make secrets", outside Git (see
# docs/adr/006-gestion-des-secrets.md), under the key names the chart expects:
# connection, fernet-key, api-secret-key and jwt-secret. With these names set,
# the chart no longer generates its own Secrets.
# - connection: URL of the airflow database in infra/postgres, with its password.
# - fernet-key: encrypts connections and variables stored in the database.
# - api-secret-key and jwt-secret: sign sessions and API tokens.
data:
  metadataSecretName: airflow-credentials
fernetKeySecretName: airflow-credentials
apiSecretKeySecretName: airflow-credentials
jwtSecretName: airflow-credentials

# Run the migration and user creation as regular Jobs instead of post-install
# hooks: with "helm --wait", pods wait for the migration while the hooks only
# start once the wait is over, so the release would never become ready.
# One-off Jobs running the Airflow CLI: they only run at install and upgrade time.
# With Argo CD, the chart documentation requires useHelmHooks and applyCustomEnv
# set to false on both Jobs ("Installing the Helm Chart with Argo CD").
# A Job cannot be modified once created, and its spec changes with every image
# tag: the Sync hook annotation makes Argo CD delete and recreate the Job on
# each sync instead of patching it. The documentation recommends it for the
# migrations; it is applied to the user creation too, for the same reason.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
  resources: &jobResources
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
  resources: *jobResources
  # Password of the web interface's admin user, from the Secret. The chart's
  # default arguments take it from the values file: they are replaced to read
  # it from the environment. "users create" does nothing when the user exists,
  # so "users reset-password" then applies the Secret's password on every sync.
  env:
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-credentials
          key: admin-password
  args:
    - bash
    - -c
    - |-
      set -euo pipefail
      airflow users create "$@" --password "${AIRFLOW_ADMIN_PASSWORD}"
      exec airflow users reset-password \
        --username "{{ .Values.createUserJob.defaultUser.username }}" \
        --password "${AIRFLOW_ADMIN_PASSWORD}"
    - --
    - --role
    - "{{ .Values.createUserJob.defaultUser.role }}"
    - --username
    - "{{ .Values.createUserJob.defaultUser.username }}"
    - --email
    - "{{ .Values.createUserJob.defaultUser.email }}"
    - --firstname
    - "{{ .Values.createUserJob.defaultUser.firstName }}"
    - --lastname
    - "{{ .Values.createUserJob.defaultUser.lastName }}"
