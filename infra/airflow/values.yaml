# Values for the apache-airflow/airflow chart 1.22.0 (Airflow 3.2.2).
# Deployed by Argo CD (infra/argocd/apps/airflow.yaml), from the main branch.

# airflowVersion drives the chart's version-specific templates: it must match
# the Airflow version of the image (apache/airflow:3.2.2 in ingestion/Dockerfile).
airflowVersion: "3.2.2"
images:
  airflow:
    # Custom image built from ingestion/Dockerfile and published by the CI
    # (.github/workflows/ci.yml), tagged with the commit SHA. To deploy a new
    # version: wait for the CI of a commit on main, then commit its SHA here.
    repository: ghcr.io/maeva-rodrigues/wattlake-airflow
    tag: 39606314ad7ef42c7015c6566e9c6afda9f75bb5
    pullPolicy: IfNotPresent

# Tasks run as subprocesses of the scheduler: no Celery workers, no Redis broker.
executor: LocalExecutor

# Sized for a single developer workload. Init containers reuse their component's
# resources; the log-groomer sidecars only delete old log files.
scheduler:
  # Also runs the tasks with LocalExecutor, hence the largest limit.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  logGroomerSidecar:
    resources: &logGroomerResources
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
apiServer:
  # REST API and web interface: 4 uvicorn worker processes by default.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
dagProcessor:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  logGroomerSidecar:
    resources: *logGroomerResources
triggerer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  logGroomerSidecar:
    resources: *logGroomerResources
  persistence:
    size: 1Gi

# The metadata database is the PostgreSQL instance from infra/postgres
# (see docs/adr/003-base-metadonnees-airflow.md), not the chart's bundled one.
postgresql:
  enabled: false
redis:
  enabled: false
# Metrics come later with the stack monitoring.
statsd:
  enabled: false

# Task logs are kept on small volumes (the chart default is 100Gi each).
# With LocalExecutor the scheduler runs the tasks, and the chart sizes its log
# volume from the worker settings, hence "workers.celery" below.
workers:
  celery:
    persistence:
      size: 1Gi

# PyIceberg catalog "wattlake", read by load_catalog("wattlake") in the DAGs:
# Nessie's Iceberg REST catalog, with the client's own S3 keys (ADR 004).
# PyIceberg maps PYICEBERG_CATALOG__WATTLAKE__S3__ACCESS_KEY_ID to s3.access-key-id.
env:
  - name: PYICEBERG_CATALOG__WATTLAKE__TYPE
    value: rest
  - name: PYICEBERG_CATALOG__WATTLAKE__URI
    value: http://nessie:19120/iceberg
  # DEVELOPMENT ONLY: fake placeholder credentials from infra/seaweedfs/values.yaml,
  # replaced by a dedicated SeaweedFS identity in a Secret at step 4.4.
  - name: PYICEBERG_CATALOG__WATTLAKE__S3__ACCESS_KEY_ID
    value: wattlake-dev-admin-access-key
  - name: PYICEBERG_CATALOG__WATTLAKE__S3__SECRET_ACCESS_KEY
    value: wattlake-dev-admin-secret-key

data:
  metadataConnection:
    user: airflow
    # DEVELOPMENT ONLY: fake placeholder password, replaced by a real secret at step 4.4.
    pass: airflow-dev
    protocol: postgresql
    host: postgres.wattlake.svc.cluster.local
    port: 5432
    db: airflow
    sslmode: disable

# DEVELOPMENT ONLY: fake placeholder keys, replaced by real secrets at step 4.4.
# Fixed values keep "helm upgrade" idempotent: generated keys would change on
# every upgrade, restart the pods and invalidate sessions and tokens.
# The Fernet key encrypts connections stored in the database (32 bytes, url-safe base64).
fernetKey: d2F0dGxha2UtZGV2LWZlcm5ldC1rZXktMzItYnl0ZXM=
apiSecretKey: wattlake-dev-api-secret-key
jwtSecret: wattlake-dev-jwt-secret

# Run the migration and user creation as regular Jobs instead of post-install
# hooks: with "helm --wait", pods wait for the migration while the hooks only
# start once the wait is over, so the release would never become ready.
# One-off Jobs running the Airflow CLI: they only run at install and upgrade time.
# With Argo CD, the chart documentation requires useHelmHooks and applyCustomEnv
# set to false on both Jobs ("Installing the Helm Chart with Argo CD").
# A Job cannot be modified once created, and its spec changes with every image
# tag: the Sync hook annotation makes Argo CD delete and recreate the Job on
# each sync instead of patching it. The documentation recommends it for the
# migrations; it is applied to the user creation too, for the same reason.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
  resources: &jobResources
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
  resources: *jobResources
  defaultUser:
    # DEVELOPMENT ONLY: fake placeholder password for the local web interface.
    password: admin-dev
