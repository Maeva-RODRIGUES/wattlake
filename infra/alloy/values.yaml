# Log collector of the local WattLake cluster (docs/adr/011-supervision.md):
# reads the logs of every pod and sends them to Loki (infra/loki/values.yaml).
# Chart: alloy 1.14.4 (version pinned in infra/argocd/apps/alloy.yaml).
# Deployed by Argo CD in the "monitoring" namespace, from the main branch.

# One pod for the whole cluster: it reads the logs through the Kubernetes API
# (loki.source.kubernetes), like "kubectl logs". No host directory to mount and
# no pod per node, which a DaemonSet reading /var/log would need; the API is
# enough for a few dozen pods.
controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      // Every pod of the cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Labels kept on each log stream: where it comes from.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // Tails the logs through the Kubernetes API.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
