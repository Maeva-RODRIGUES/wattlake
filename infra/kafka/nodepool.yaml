# Node pool of the "wattlake" Kafka cluster: one node with both the KRaft
# controller and broker roles, enough for a single-developer stack.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: wattlake
spec:
  replicas: 1
  roles:
    - controller
    - broker
  # Persistent volume (k3s local-path), so that messages and KRaft metadata
  # survive a pod or cluster restart. The claim is kept if the cluster is
  # deleted (deleteClaim defaults to false).
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        # The KRaft metadata log shares this volume with the topic data.
        kraftMetadata: shared
  # Heap fixed below the memory limit, leaving room for the page cache and
  # the JVM's own memory.
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi
