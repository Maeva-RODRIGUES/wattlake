# Kafka topics, created and kept in line by the Topic Operator (topic creation
# by clients is disabled: auto.create.topics.enable is false in kafka.yaml).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: eco2mix-realtime
  labels:
    strimzi.io/cluster: wattlake
spec:
  # Real-time eCO2mix rows published by the producer (streaming/): key = the
  # quarter-hour, value = the row in a JSON envelope (streaming/README.md).
  # One partition keeps every quarter-hour in order; the volume is tiny
  # (a few dozen messages per hour).
  partitions: 1
  # Single broker in the local cluster.
  replicas: 1
  config:
    # Compaction keeps the latest message of each key: one version per
    # quarter-hour, the latest one RTE published, with no time limit.
    cleanup.policy: compact
