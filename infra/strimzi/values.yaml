# Strimzi cluster operator for the local WattLake cluster.
# Chart: strimzi-kafka-operator 1.3.0 (version pinned in infra/argocd/apps/strimzi.yaml).
# Deployed by Argo CD in the "strimzi" namespace, from the main branch.

# The operator runs in its own namespace and only manages the Kafka resources
# of "wattlake" (infra/kafka/): the chart creates its RoleBindings there
# (watchAnyNamespace: false). Its only cluster-wide rights are on cluster-scoped
# objects: nodes, storage classes and ClusterRoleBindings.
watchNamespaces:
  - wattlake

# Chart defaults, written here to be explicit: the operator is a JVM sized for
# a few clusters, and requests equal limits for memory.
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 384Mi
