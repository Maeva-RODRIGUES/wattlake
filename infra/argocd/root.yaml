# Root Application ("app of apps"): deploys the Applications of every
# component, read from infra/argocd/apps/ on the main branch.
# Applied once by "make argocd-apps", after Argo CD is installed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wattlake
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Maeva-RODRIGUES/wattlake.git
    targetRevision: main
    path: infra/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Manual sync for now: each component is taken over from Helm one at a time,
  # after reading its diff (see infra/README.md).
  syncPolicy: {}
