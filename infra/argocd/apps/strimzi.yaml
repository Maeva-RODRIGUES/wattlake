# Argo CD Application for the Strimzi cluster operator (Kafka on Kubernetes).
# Synced automatically from the main branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  sources:
    # The chart, at its pinned version: 1.3.0 (2026-10-12). 1.3.1 (2026-11-04)
    # was less than two weeks old when pinning.
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 1.3.0
      helm:
        releaseName: strimzi
        valueFiles:
          - $values/infra/strimzi/values.yaml
    # This repository, referenced as $values for the values file above.
    - repoURL: https://github.com/Maeva-RODRIGUES/wattlake.git
      targetRevision: main
      ref: values
  # Automated sync: the cluster follows the main branch. prune deletes what is
  # removed from Git, selfHeal reverts changes made by hand in the cluster.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Kafka CRD is about 350 KB: client-side apply would store it in the
      # last-applied-configuration annotation, limited to 256 KB.
      - ServerSideApply=true
