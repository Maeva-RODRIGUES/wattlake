# Argo CD Application for the real-time producer (streaming/). Synced automatically from the main branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streaming
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: wattlake
  # Kustomize directory: the manifests of infra/streaming.
  source:
    repoURL: https://github.com/Maeva-RODRIGUES/wattlake.git
    targetRevision: main
    path: infra/streaming
  # Automated sync: the cluster follows the main branch. prune deletes what is
  # removed from Git, selfHeal reverts changes made by hand in the cluster.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
