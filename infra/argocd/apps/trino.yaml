# Argo CD Application for Trino (query engine). Synced manually for now (see infra/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trino
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: wattlake
  sources:
    # The chart, at its pinned version. releaseName keeps the resource names of
    # the former Helm release, so that Argo CD takes over the existing objects.
    - repoURL: https://trinodb.github.io/charts
      chart: trino
      targetRevision: 1.45.0
      helm:
        releaseName: trino
        valueFiles:
          - $values/infra/trino/values.yaml
    # This repository, referenced as $values for the values file above.
    - repoURL: https://github.com/Maeva-RODRIGUES/wattlake.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
