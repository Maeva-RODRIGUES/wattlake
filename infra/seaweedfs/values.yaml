# SeaweedFS object storage for the local WattLake cluster.
# Chart: seaweedfs/seaweedfs 4.52.0 (version pinned in infra/argocd/apps/seaweedfs.yaml).
# Deployed by Argo CD (infra/argocd/apps/seaweedfs.yaml), from the main branch.

image:
  tag: "4.52"

global:
  seaweedfs:
    # The chart's pod read/write ClusterRole is a migration leftover that no
    # SeaweedFS component uses (see the chart's networkpolicy.yaml): skip it.
    createClusterRole: false

master:
  replicas: 1
  # Single volume server: no replication ("000").
  defaultReplication: "000"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Raft state on a PVC so it follows the pod if it is rescheduled.
  data:
    type: persistentVolumeClaim
    size: 1Gi
    storageClass: local-path
  logs:
    type: emptyDir

volume:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  dataDirs:
    - name: data1
      type: persistentVolumeClaim
      size: 10Gi
      storageClass: local-path
      maxVolumes: 0

filer:
  replicas: 1
  # Sized for the filer plus the embedded S3 gateway.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Filer metadata store (leveldb) on a PVC.
  data:
    type: persistentVolumeClaim
    size: 1Gi
    storageClass: local-path
  logs:
    type: emptyDir
  # S3 gateway embedded in the filer pod (port 8333): one pod less than the standalone gateway.
  s3:
    enabled: true
    enableAuth: true
    # S3 identities (one per component) from a Secret created by "make secrets",
    # outside Git (see docs/adr/006-gestion-des-secrets.md). Argo CD renders the
    # chart without reading the cluster, so the pod checksum does not follow the
    # Secret: after a change, restart the filer pod.
    existingConfigSecret: seaweedfs-s3-config
    createBuckets:
      - name: warehouse
    # Short-lived Job that runs "weed shell" to create the buckets.
    createBucketsHook:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
