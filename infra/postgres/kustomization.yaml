# PostgreSQL for the Airflow metadata database (see docs/adr/003-base-metadonnees-airflow.md).
# Deployed by Argo CD (infra/argocd/apps/postgres.yaml), from the main branch.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wattlake
labels:
  - pairs:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: wattlake
    includeSelectors: true
resources:
  - initdb.yaml
  - service.yaml
  - statefulset.yaml
