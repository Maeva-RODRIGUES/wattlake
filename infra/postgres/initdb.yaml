# SQL run by the postgres image entrypoint, only when the data directory is empty.
# Changing this file has no effect on an existing volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  01-airflow.sql: |
    -- DEVELOPMENT ONLY: fake placeholder password, replaced by a real secret at step 4.4.
    CREATE ROLE airflow WITH LOGIN PASSWORD 'airflow-dev';
    -- The owner gets full rights on the database and its public schema, and nothing else.
    CREATE DATABASE airflow OWNER airflow;
