# Metrics of the local WattLake cluster: Prometheus Operator, Prometheus,
# Grafana, node-exporter and kube-state-metrics (docs/adr/011-supervision.md).
# Chart: kube-prometheus-stack 92.14.1 (version pinned in infra/argocd/apps/monitoring.yaml).
# Deployed by Argo CD in the "monitoring" namespace, from the main branch.

# Alertmanager receives the alerts of Prometheus: the default rules of the chart
# and the WattLake ones (infra/monitoring/rules/, docs/adr/016-alertes.md).
alertmanager:
  enabled: true
  config:
    route:
      # One notification per alert name and namespace, so that several pods
      # failing the same way are grouped.
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # No notification channel yet: alerts are visible in the Alertmanager
      # and Grafana web interfaces only.
      receiver: "null"
      routes:
        # Watchdog always fires, to prove that the alerting pipeline works:
        # it is never notified.
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
    # A critical alert silences the warning alerts of the same name and
    # namespace (the chart's default inhibition rule).
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [namespace, alertname]
    receivers:
      - name: "null"
  alertmanagerSpec:
    # Notification log and silences live on the pod's disk: a restart forgets
    # the silences, which is acceptable on a local cluster.
    retention: 120h
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# k3s runs the control plane in a single process and does not expose these
# components' metrics endpoints: their targets would always be down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up every ServiceMonitor and PodMonitor of the cluster, not only the
    # ones labelled for this Helm release: the Nessie and Trino charts create
    # their own, and the Kafka ones are defined below.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # One week of history is enough to follow the pipelines locally.
    retention: 7d
    retentionSize: 4GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

  # Kafka: the brokers' metrics (Strimzi metrics reporter) and the Kafka
  # Exporter, which reports consumer group lag (the writer's freshness). Both
  # pods carry strimzi.io/kind=Kafka and serve /metrics on tcp-prometheus
  # (packaging/examples/metrics in the Strimzi repository).
  additionalPodMonitors:
    - name: kafka
      namespaceSelector:
        matchNames: [wattlake]
      selector:
        matchExpressions:
          - key: strimzi.io/kind
            operator: In
            values: [Kafka]
      podMetricsEndpoints:
        - port: tcp-prometheus
          path: /metrics
          relabelings:
            # Keep the strimzi.io/* labels (cluster, name, pool) on every series.
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(strimzi_io_.+)
              replacement: $1

  # Airflow: the chart's StatsD exporter, which turns the scheduler's and the
  # tasks' StatsD metrics into Prometheus metrics (infra/airflow/values.yaml).
  additionalServiceMonitors:
    - name: airflow-statsd
      namespaceSelector:
        matchNames: [wattlake]
      selector:
        matchLabels:
          tier: airflow
          component: statsd
      endpoints:
        - port: statsd-scrape
          path: /metrics

grafana:
  # Admin credentials from a Secret created by "make secrets", outside Git
  # (docs/adr/006-gestion-des-secrets.md), never the chart's default.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards are provisioned from ConfigMaps labelled grafana_dashboard=1
  # (infra/monitoring/dashboards/), and kept in Git: edits made in the web
  # interface are lost on restart.
  persistence:
    enabled: false
  # The sidecar adds the Alertmanager data source (enabled by default): firing
  # alerts and silences are visible in Grafana, next to the metrics.
  # Logs, next to the metrics (infra/loki/values.yaml).
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
