# Nessie GC (docs/adr/013-maintenance-iceberg.md): the suspended CronJob that
# serves as Job template, and the permissions Airflow needs to start it.
# Deployed by Argo CD (infra/argocd/apps/nessie-gc.yaml), from the main branch.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wattlake
labels:
  - pairs:
      app.kubernetes.io/part-of: wattlake
resources:
  - cronjob.yaml
  - rbac.yaml
